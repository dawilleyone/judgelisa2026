<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Content Manager — Keep Judge Langford 2026</title>
		<link rel="shortcut icon" href="../images/favicon.png" />
	</head>
	<body>
		<!-- Optional: Netlify Identity widget. Loaded if site uses Netlify Identity for login. -->
		<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

		<!-- Decap CMS itself -->
		<script src="https://unpkg.com/decap-cms@^3.5.0/dist/decap-cms.js"></script>

		<script>
			// Redirect to login if Netlify Identity is in use
			if (window.netlifyIdentity) {
				window.netlifyIdentity.on("init", user => {
					if (!user) {
						window.netlifyIdentity.on("login", () => {
							document.location.href = "/admin/";
						});
					}
				});
			}
		</script>
	</body>
</html>
